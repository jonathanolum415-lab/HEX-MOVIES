services:
  - type: web
    name: hex-movies
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: MOVIE_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: MOVIE_DATABASE
        value: /tmp/movies.db
      - key: MOVIE_UPLOAD_FOLDER
        value: /tmp/uploads
      - key: MOVIE_MAX_UPLOAD_MB
        value: "512"
      - key: MOVIE_ADMIN_SETUP_TOKEN
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
