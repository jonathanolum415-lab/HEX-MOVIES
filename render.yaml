services:
  - type: web
    name: hex-movies
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: MOVIE_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: MOVIE_DATABASE
        value: /var/data/movies.db
      - key: MOVIE_UPLOAD_FOLDER
        value: /var/data/uploads
      - key: MOVIE_MAX_UPLOAD_MB
        value: "2048"
      - key: MOVIE_ADMIN_SETUP_TOKEN
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
    disk:
      name: hex-movies-data
      mountPath: /var/data
      sizeGB: 10
